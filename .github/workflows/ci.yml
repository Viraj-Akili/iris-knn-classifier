name: Enterprise ML CI/CD & Production Release Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Code Quality, Linting, & Automated Testing Suite
  # =========================================================================
  lint-and-test:
    name: Code Quality, Linting & Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Dev Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Run Ruff Linting Inspection
        run: |
          ruff check .

      - name: Run Pytest Test Suite with Coverage
        run: |
          pytest --cov=src --cov=app --cov=frontend --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # =========================================================================
  # 2. Production Docker Multi-Container Build & Integration Verification
  # =========================================================================
  docker-build-and-verify:
    name: Docker Build & Compose Integration Test
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: iris-ml-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Streamlit Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: iris-ml-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Launch Docker Compose Stack
        run: |
          docker compose up -d --build
          echo "Waiting for container services to achieve healthy state..."
          sleep 15
          docker compose ps

      - name: Run Production Smoke Test Suite Inside CI
        run: |
          python -m pip install --upgrade pip
          pip install httpx numpy
          python scripts/production_smoke_test.py --api-url http://localhost:8000 --frontend-url http://localhost:8501 --samples 15

      - name: Teardown Docker Compose Stack
        if: always()
        run: |
          docker compose down -v

  # =========================================================================
  # 3. Continuous Cloud Deployment (Main Branch Only)
  # =========================================================================
  deploy-production:
    name: Deploy to Production Cloud (Render / Cloud Run)
    needs: [lint-and-test, docker-build-and-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Backend Cloud Deployment Hook
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering automated deployment for FastAPI backend..."
          curl -f -X POST "$RENDER_BACKEND_DEPLOY_HOOK"

      - name: Trigger Frontend Cloud Deployment Hook
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering automated deployment for Streamlit dashboard..."
          curl -f -X POST "$RENDER_FRONTEND_DEPLOY_HOOK"
